; LoadingThreader -- LT-2b (v0.2.0) PASSIVE timing probe (SkyrimSE 1.6.1170.0 only).
; Read once at plugin load, from the folder of the DLL (falls back to Data/SKSE/Plugins/). Values: 1 = on, 0 = off. A missing key uses the default shown.
; The probe never changes game behaviour: each hook calls the original with the same
; arguments and returns its result. It writes only its own log, LoadingThreader.log,
; in Documents/My Games/Skyrim Special Edition/SKSE/ (or Data/SKSE/Plugins/ as a fallback).

[General]
; THE KILL-SWITCH. 1 = install the probe (its purpose). 0 = install NO hook at all;
; the DLL then only logs that it is inactive. Default 1.
bEnabled=1

; 1 = also log every site's verified bytes at install. Default 0.
bVerboseLog=0

[Hooks]
; Per-group switches. A group whose sites fail verification is skipped on its own and the
; report says "NOT HOOKED" with the reason. The gate (the startup LoadFiles call, 13753)
; has no switch: without it nothing can be measured, so bEnabled=0 is its switch.

; 13760 per-plugin loader: wall time per plugin, and the per-plugin slots. Default 1.
; With 0 every measurement lands in slot 0 (no per-plugin table).
bPerPlugin=1

; 13763 per-record dispatcher: record count per plugin, compressed-record count. Default 1.
bRecord=1

; 13690 Load wrapper (16 call sites in 13763): time in the form-type Load bodies. Default 1.
bLoadBody=1

; 13991 TESFile::ReadData: raw subrecord read time. This is the only ENTRY detour (the
; function has ~900 callers). Turn it off first if the probe is suspected of a crash. Default 1.
bRawRead=1

; 14032 TESFile inflate (its 3 call sites): count, bytes in/out, time. The number that
; decides whether stage 2 is worth building. Default 1.
bInflate=1

; 13784 InitItem pass after the plugin loop: one wall time and the P0..P10 phase brackets. Default 1.
bPostLoop=1

; ---- v2 (LT-2b) groups. All default 1. A group whose sites fail verification skips on its own. ----

; 13753's 25 direct callees (world reset, per-file flag getters, compile index, BSA gate and
; auto-load, pass-1 OpenTES, hard-coded forms, buffers, navmesh): ordered table with time,
; kernel/user split and the 'residual unattributed' line. Also the LoadFiles segments. Default 1.
bLfCallees=1

; 13784's 22 callees plus 5 virtual InitItem sites, and the phase markers P0..P10 (wall,
; kernel/user, threads). Needs bPostLoop=1 for the phase brackets. Default 1.
bInitPass=1

; The per-form InitItem call (0x1BE221, once per form): per-form-type count, total time, max
; single form, log2 histogram. The most frequent v2 hook; turn it off first if overhead matters. Default 1.
bPerForm=1

; WRLD persistent cell, child cells (20455, 20563) and interior-cell refs (18882) InitItem. Also
; fires at runtime (cell attach), attributed to the open runtime episode. Default 1.
bInitRefs=1

; 13760's 7 internal callees (second OpenTES, TES4 header, SeekNextForm, editor-ID insert,
; CloseTES, ...): per-column totals and per-plugin columns. Default 1.
bLoopSplit=1

; 13763 -> 13693 AddFormToDataHandler: forms created, per type. Default 1.
bNewForms=1

[Episodes]
; 1 = open a runtime episode 'runtime-loadscreen-N' while the Loading Menu is open (read-only UI
; event sink; hooked work is attributed only while it is open; nothing is measured otherwise).
; Up to 48 episodes per session. Default 1.
bRuntimeLoadScreens=1

; Free-text labels, comma separated; runtime episode n gets the n-th label (the startup episode is
; 'launch'). Lets the tester's routine be matched to episodes by order. Default below.
sLabels=saveload,door-in,door-out,fasttravel

[Oracle]
; 1 = at kDataLoaded, on the main thread, read-only under the allForms read lock: total forms,
; per-type counts, an order-independent digest and per-formArray order digests, as one
; machine-readable 'LT-ORACLE' line. A future threaded load must reproduce it. Default 1.
bFormDigest=1

[Report]
; 1 = also write LoadingThreader-v2.csv next to the log: one sectioned CSV, a header per
; section, an 'episode' column on every row. Default 1.
bCsv=1

; How many plugins to list in the "Top N by wall time" table. Default 25.
iTopN=25

; 1 = also print every plugin in load order. Default 1.
bFullTable=1

[Advanced]
; If another plugin has already re-pointed the startup LoadFiles call (site 36553+0x341),
; the probe refuses to install (default 0). 1 = chain to whatever the call points at
; instead; LoadFiles ms then includes that plugin's wrapper. Only for a second run after
; the log said the gate site was patched. Default 0.
bAllowPatchedGate=0
