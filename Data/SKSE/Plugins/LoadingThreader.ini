; LoadingThreader -- LT-2 stage-1 PASSIVE timing probe (SkyrimSE 1.6.1170.0 only).
; Read once at plugin load. Values: 1 = on, 0 = off. A missing key uses the default shown.
; The probe never changes game behaviour: each hook calls the original with the same
; arguments and returns its result. It writes only its own log, LoadingThreader.log,
; in Documents/My Games/Skyrim Special Edition/SKSE/ (or Data/SKSE/Plugins/ as a fallback).

[General]
; THE KILL-SWITCH. 1 = install the probe (its purpose). 0 = install NO hook at all;
; the DLL then only logs that it is inactive. Default 1.
bEnabled=1

; 1 = also log every site's verified bytes at install. Default 0.
bVerboseLog=0

[Hooks]
; Per-group switches. A group whose sites fail verification is skipped on its own and the
; report says "NOT HOOKED" with the reason. The gate (the startup LoadFiles call, 13753)
; has no switch: without it nothing can be measured, so bEnabled=0 is its switch.

; 13760 per-plugin loader: wall time per plugin, and the per-plugin slots. Default 1.
; With 0 every measurement lands in slot 0 (no per-plugin table).
bPerPlugin=1

; 13763 per-record dispatcher: record count per plugin, compressed-record count. Default 1.
bRecord=1

; 13690 Load wrapper (16 call sites in 13763): time in the form-type Load bodies. Default 1.
bLoadBody=1

; 13991 TESFile::ReadData: raw subrecord read time. This is the only ENTRY detour (the
; function has ~900 callers). Turn it off first if the probe is suspected of a crash. Default 1.
bRawRead=1

; 14032 TESFile inflate (its 3 call sites): count, bytes in/out, time. The number that
; decides whether stage 2 is worth building. Default 1.
bInflate=1

; 13784 InitItem pass after the plugin loop: one wall time. Default 1.
bPostLoop=1

[Report]
; How many plugins to list in the "Top N by wall time" table. Default 25.
iTopN=25

; 1 = also print every plugin in load order. Default 1.
bFullTable=1

[Advanced]
; If another plugin has already re-pointed the startup LoadFiles call (site 36553+0x341),
; the probe refuses to install (default 0). 1 = chain to whatever the call points at
; instead; LoadFiles ms then includes that plugin's wrapper. Only for a second run after
; the log said the gate site was patched. Default 0.
bAllowPatchedGate=0
